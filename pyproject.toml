[project]
name = "plumbline"
version = "0.1.0"
description = "The 90% of an LLM app that isn't the LLM: ingestion, hybrid retrieval, output validation, failure handling and evaluation for a cited-answer RAG system."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.7",
    "pymupdf>=1.24,<1.26",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.80"]

[project.scripts]
plumbline = "plumbline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plumbline"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "anthropic>=0.80"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
