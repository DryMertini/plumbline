name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q

  eval-gate:
    # The quality gate: rebuilds the index from the real papers and fails the build if
    # retrieval, answer quality or resilience drop below evals/thresholds.yaml.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - name: Cache corpus PDFs
        uses: actions/cache@v4
        with:
          path: data/raw
          key: corpus-${{ hashFiles('corpus/manifest.yaml') }}
      - run: uv run plumbline fetch
      - run: uv run plumbline ingest
      - run: uv run plumbline eval --gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: reports/latest/
